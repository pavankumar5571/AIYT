name: Daily AI-YouTube video

# Runs the ENTIRE existing Docker stack (n8n + postgres + edge-tts + ffmpeg)
# ephemerally on a GitHub-hosted runner, generates one story video, and uploads
# it PRIVATE. No servers to maintain. State (story-log for de-dup) is committed
# back to the repo each run.

on:
  workflow_dispatch: {}          # manual "Run workflow" button (use this to test)
  schedule:
    - cron: "0 7 * * *"          # 07:00 UTC daily

permissions:
  contents: write                # to commit story-log.json back

concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Prepare env + output dirs
        env:
          ENC_KEY: ${{ secrets.N8N_ENCRYPTION_KEY }}
        run: |
          mkdir -p \
            output/stories output/scenes output/flow output/flow_in output/images \
            output/audio output/subtitles output/thumbnails output/videos output/seo \
            output/_tts_jobs output/_render_jobs logs assets/music
          # The n8n container runs as uid 1000 (the `node` user), but these
          # bind-mounted dirs are created by the runner user (uid 1001), so n8n
          # can't write its outputs -> EACCES on /data/output/..., /data/logs/
          # story-log.json, and /data/prompts/character-bible.json (Module 06).
          # (Works locally only because Docker Desktop ignores uid perms on
          # Windows bind mounts.) Hand every dir n8n writes to over to uid 1000.
          # chown leaves file modes intact, so no git-diff noise.
          sudo chown -R 1000:1000 output logs prompts
          # Credentials are imported from a DECRYPTED export (see .secrets guide),
          # so the encryption key no longer has to match anything: import
          # re-encrypts with whatever key this ephemeral runner uses, and the key
          # is discarded when the runner is destroyed. Generate one if the secret
          # is unset so a missing/wrong N8N_ENCRYPTION_KEY can't fail the run.
          KEY="${ENC_KEY:-$(openssl rand -hex 16)}"
          cat > .env <<EOF
          POSTGRES_USER=n8n
          POSTGRES_PASSWORD=ci_$(date +%s)
          POSTGRES_DB=n8n
          N8N_HOST=localhost
          GENERIC_TIMEZONE=UTC
          N8N_ENCRYPTION_KEY=$KEY
          EOF

      - name: Build + start stack
        run: docker compose -f docker/docker-compose.yml --env-file .env up -d --build

      - name: Wait for n8n to be ready
        run: |
          # Poll n8n's HTTP readiness endpoint (200 only AFTER migrations complete).
          # Do NOT probe with `n8n list:workflow`: that CLI command boots a second
          # n8n instance which runs DB migrations concurrently with the main
          # process. On a fresh database the two race the initial migration and
          # crash it ("duplicate key ... pg_type_typname_nsp_index" on
          # webhook_entity), which then breaks Module 04. curl never touches the DB.
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5678/healthz/readiness || true)
            if [ "$code" = "200" ]; then echo "n8n ready"; exit 0; fi
            sleep 3
          done
          echo "n8n did not become ready (last code=${code:-none})"
          docker compose -f docker/docker-compose.yml logs --tail=120; exit 1

      - name: Import workflows + credentials
        env:
          CREDS: ${{ secrets.N8N_CREDENTIALS_JSON }}
        run: |
          printf '%s' "$CREDS" > credentials.json
          docker cp credentials.json aiyt_n8n:/tmp/credentials.json
          rm -f credentials.json
          docker exec aiyt_n8n sh -c 'find /data/workflows -name "*.json" -exec n8n import:workflow --input={} \;'
          docker exec aiyt_n8n n8n import:credentials --input=/tmp/credentials.json

      - name: Generate + upload (private)
        run: bash scripts/run-daily.sh

      - name: Mark run failed (for the dashboard)
        if: failure()
        run: |
          node -e "require('fs').writeFileSync('dashboard/data/status.json', JSON.stringify({ last_run_at: new Date().toISOString(), status: 'failed', story_id: null, video_url: null, run_url: process.env.RUN_URL }, null, 2))"
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Commit state + refreshed dashboard data
        if: always()
        run: |
          git config user.name "aiyt-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/story-log.json dashboard/data || true
          git commit -m "daily run: $(date -u +%F)" || echo "no state change"
          git push || echo "nothing to push"

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs --tail=200
